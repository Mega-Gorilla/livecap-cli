name: Integration Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"  # Weekly on Mondays at 03:00 UTC
  pull_request:
    paths:
      - 'livecap_cli/**'
      - 'tests/integration/**'
      # **非 ASCII の real-model / gpu ゲートは本 workflow の中にある。**
      # ここを入れないと tests/nonascii/ を壊しても、それを実行する唯一の
      # ゲートが起動しない (#413 PR B で実際に起きた)。
      - 'tests/nonascii/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/integration-tests.yml'
      # GPU job が使う script (warm / PASSED の要求 / 非 ASCII 回帰の判定)。
      # 判定 script は自身が回帰の trigger にも入っている
      - '.github/scripts/**'
      # 本 workflow が使う composite action (setup-livecap-cuda-venv / setup-livecap-ffmpeg)。
      # action だけを変えたときも GPU smoke を通す (#470)
      - '.github/actions/**'

# 同じ PR に新しい push があったら、古い HEAD の run を取り消す。
# group は PR 番号ごと。PR 以外 (main への push / schedule / workflow_dispatch) は run_id を
# group にするので、互いに取り消し合わない。
# **この workflow で特に効く**: self-hosted の GPU runner は 1 台だけで、置き換え済みの
# engine-smoke-gpu (20〜25 分) が新しい HEAD の GPU job を待たせていた (#470 の調査)。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  transcription-pipeline:
    strategy:
      fail-fast: false
      matrix:
        # hosted (ubuntu) + self-hosted Windows (RTX 4090)。
        # self-hosted Linux runner は運用していないため matrix から除外
        # (登録されない runner 宛の job は 24h キュー滞留後に cancel され、
        #  PR check が恒久的に赤くなるため)。docs/development/self-hosted-runners.md 参照
        os: [ubuntu-latest, [self-hosted, windows]]

    runs-on: ${{ matrix.os }}
    # runner が job を pickup した後に test が hang した場合の hard fail
    # (hosted ubuntu-latest は通常 <2 min で完了)。
    # 注: timeout-minutes は pickup 後にのみ計測されるため、runner offline で
    # queue に滞留するケースは防げない (GitHub の 24h キュー上限で cancel)。
    # self-hosted runner 復旧手順は docs/development/self-hosted-runners.md 参照。
    timeout-minutes: 60
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install libc++ for TenVAD on Ubuntu
      - name: Install libc++ (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libc++1

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Configure Persistent Paths (Windows Self-hosted)
        if: contains(toJSON(matrix.os), 'windows') && contains(toJSON(matrix.os), 'self-hosted')
        shell: pwsh
        run: |
          $ffmpeg = "C:\LiveCap\Cache\ffmpeg-bin"
          New-Item -ItemType Directory -Force -Path $ffmpeg | Out-Null
          "LIVECAP_FFMPEG_BIN=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Runs unconditionally: the action owns both the cache and the
      # "already installed?" decision, and verifies whatever it finds (#395).
      - name: Setup LiveCap FFmpeg
        uses: ./.github/actions/setup-livecap-ffmpeg
        with:
          ffmpeg-bin-dir: ${{ env.LIVECAP_FFMPEG_BIN || 'ffmpeg-bin' }}
          # Self-hosted keeps a persistent directory outside the workspace.
          cache: ${{ env.LIVECAP_FFMPEG_BIN != '' && 'false' || 'true' }}

      - name: Sync dependencies
        run: uv sync --extra translation --extra dev --extra engines-torch

      - name: Run integration tests
        env:
          # Python handles forward slashes on all platforms
          # Use persistent path if available, else relative path
          LIVECAP_FFMPEG_BIN: "${{ env.LIVECAP_FFMPEG_BIN || format('{0}/ffmpeg-bin', github.workspace) }}"
          # Enable realtime E2E tests on self-hosted runners only
          LIVECAP_ENABLE_REALTIME_E2E: ${{ contains(toJSON(matrix.os), 'self-hosted') && '1' || '' }}
        run: |
          uv run python -m pytest tests/integration -m "not engine_smoke"

  engine-smoke-cpu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Setup LiveCap FFmpeg
        uses: ./.github/actions/setup-livecap-ffmpeg
        with:
          ffmpeg-bin-dir: 'ffmpeg-bin'

      - name: Sync dependencies
        run: uv sync --extra translation --extra dev --extra engines-torch

      - name: Warm engine caches (CPU)
        env:
          LIVECAP_FFMPEG_BIN: "${{ github.workspace }}/ffmpeg-bin"
        run: |
          uv run python - <<'PY'
          from livecap_cli import EngineFactory

          def warm(engine_type: str, device: str, lang: str, model_size: str = None) -> None:
              engine_options = {}
              if engine_type == "whispers2t":
                  engine_options["language"] = lang
                  engine_options["model_size"] = model_size or "base"
              elif engine_type in ("canary", "voxtral"):
                  engine_options["language"] = lang
              engine = EngineFactory.create_engine(
                  engine_type=engine_type,
                  device=device,
                  **engine_options,
              )
              engine.load_model()
              models_dir = engine.model_manager.models_root
              print(f"[{engine_type}/{device}] cached at: {models_dir}")

          warm("whispers2t", "cpu", "en", "base")
          PY

      - name: Run engine smoke tests (CPU)
        env:
          LIVECAP_FFMPEG_BIN: "${{ github.workspace }}/ffmpeg-bin"
          LIVECAP_REQUIRE_ENGINE_SMOKE: ${{ vars.LIVECAP_REQUIRE_ENGINE_SMOKE }}
        run: |
          uv run python -m pytest tests/integration/engines -m "engine_smoke and not gpu"

  engine-smoke-gpu:
    if: vars.LIVECAP_ENABLE_GPU_SMOKE == '1'
    strategy:
      fail-fast: false
      matrix:
        # self-hosted Linux runner は未運用のため windows のみ
        # (docs/development/self-hosted-runners.md 参照)
        os: [[self-hosted, windows]]

    runs-on: ${{ matrix.os }}
    # GPU engine_smoke (Canary/Parakeet/Voxtral/Whisper の model load +
    # transcribe + token_confidence verify) は cold cache 時に最大 20-30 min。
    # runner が job を pickup した後に hang した場合、60 min で hard fail。
    # 注: timeout-minutes は pickup 後にのみ計測されるため、runner offline で
    # queue に滞留するケースは防げない (GitHub の 24h キュー上限で cancel)。
    # self-hosted runner 復旧手順は docs/development/self-hosted-runners.md 参照。
    timeout-minutes: 60

    env:
      LIVECAP_ENABLE_GPU_SMOKE: ${{ vars.LIVECAP_ENABLE_GPU_SMOKE }}
      LIVECAP_REQUIRE_ENGINE_SMOKE: ${{ vars.LIVECAP_REQUIRE_ENGINE_SMOKE }}
      # **PR で Linux の GPU job (engine-smoke-gpu-linux) が有効なら、OS に依らない engine smoke は
      # そちらが受け持つ** — この job は Voxtral (16 GB 要) と Windows 固有の確認だけになる。
      # schedule / workflow_dispatch と、Linux を止めている間 (repo 変数が 1 以外) は全部ここで回す
      LIVECAP_LINUX_TAKES_SMOKE: ${{ github.event_name == 'pull_request' && vars.LIVECAP_ENABLE_LINUX_GPU_SMOKE == '1' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # PR の merge commit と、その親 (base の先端) まで取る。非 ASCII 回帰を
          # 回すかの判定 (nonascii_regression_scope.py) が `HEAD^1..HEAD` で PR の変更を見る
          fetch-depth: 2

      - name: Configure Persistent Paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cacheRoot = "C:\LiveCap\Cache"
          
          # Ensure directories exist
          New-Item -ItemType Directory -Force -Path "$cacheRoot\uv" | Out-Null
          New-Item -ItemType Directory -Force -Path "$cacheRoot\models" | Out-Null
          New-Item -ItemType Directory -Force -Path "$cacheRoot\cache" | Out-Null
          New-Item -ItemType Directory -Force -Path "$cacheRoot\ffmpeg-bin" | Out-Null
          
          # Set Environment Variables
          "UV_CACHE_DIR=$cacheRoot\uv" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIVECAP_CORE_MODELS_DIR=$cacheRoot\models" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIVECAP_CORE_CACHE_DIR=$cacheRoot\cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIVECAP_FFMPEG_BIN=$cacheRoot\ffmpeg-bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          
          Write-Host "Configured persistent paths at $cacheRoot"

      - name: Use preinstalled Python (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $python = Get-Command python3.12 | Select-Object -ExpandProperty Source
          if (-not $python) { throw "python3.12 not found on runner" }
          Write-Host "Using python at $python"
          "PYTHON_EXE=$python" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      # Restore UV_CACHE_DIR after setup-uv overwrites it with a temp path
      - name: Restore UV_CACHE_DIR (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "UV_CACHE_DIR=C:\LiveCap\Cache\uv" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Restored UV_CACHE_DIR to C:\LiveCap\Cache\uv"

      # No existence gate here. Gating on "ffmpeg.exe is present" skipped the
      # action outright, and verification with it, so a stale binary in the
      # persistent directory was never noticed (#395). The action decides.
      - name: Setup LiveCap FFmpeg
        uses: ./.github/actions/setup-livecap-ffmpeg
        with:
          ffmpeg-bin-dir: ${{ env.LIVECAP_FFMPEG_BIN }}
          # Persistent directory outside the workspace: actions/cache does not
          # apply to it, but the action still verifies what is already there.
          cache: 'false'

      # uv.lock から同期して CUDA build へ差し替え、CUDA が無ければ落とす (#379)。
      # 手順と理由は action 側に 1 か所だけ置く (optimize-vad / benchmark-* と共有、#470)。
      # engines-qwen3asr は NeMo と競合しない (#413 PR C: 25 パッケージの純粋な追加)。
      # qwen3asr の utterance_wav 境界を測るために要る。
      - name: Sync dependencies (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-livecap-cuda-venv
        with:
          extras: translation dev engines-torch engines-nemo engines-qwen3asr

      - name: Warm engine caches (GPU / self-hosted, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # LIVECAP_FFMPEG_BIN is already set globally by Configure Persistent Paths.
        # 対象と理由は script 側に置く (Linux の job と共有、Voxtral を含む全部を温める)
        run: |
          python .github/scripts/warm_engine_caches.py all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run engine smoke tests (GPU / self-hosted, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # LIVECAP_FFMPEG_BIN set globally
          LIVECAP_ENABLE_GPU_SMOKE: ${{ vars.LIVECAP_ENABLE_GPU_SMOKE }}
          LIVECAP_REQUIRE_ENGINE_SMOKE: ${{ vars.LIVECAP_REQUIRE_ENGINE_SMOKE }}
        run: |
          # Linux が受け持つときは Voxtral だけ (Linux の 12 GB では min_vram_gb=16 で skip になる)
          $select = @()
          if ($Env:LIVECAP_LINUX_TAKES_SMOKE -eq 'true') { $select = @('-k', 'voxtral') }
          python -m pytest tests/integration/engines -m "engine_smoke and gpu" @select -v

      # 非 ASCII パスの real-model regression (#377)。
      #
      # 通常 CI (`pytest tests`) では cheap tier しか走らない — real_model tier は
      # LIVECAP_NONASCII_REAL_MODELS=1 と `slow` マーカーの両方を要求するため
      # (tests/nonascii/test_probes.py の test_real_model_boundary)。判定を
      # observation から regression へ変えるだけでは**将来の依存更新を防ぐ
      # ゲートにならない**ので、実モデルが常駐するこの job に置く。
      #
      # このランナーは LIVECAP_CORE_MODELS_DIR を永続させ、上の warmup で
      # reazonspeech を温めている。
      #
      # **PR では、依存 / tests/nonascii / livecap_cli/paths / .github/actions / この workflow
      # を変えたときだけ回す** (この job の約半分の 13 分を占める)。実モデル tier が見るのは
      # ネイティブライブラリの非 ASCII path の扱いで、変えるのは依存と境界の helper である。
      # 呼び出し側の配線は cheap tier (registry / AST、Core Tests で毎 PR) が固定する。
      # 週次の schedule と workflow_dispatch では必ず回す。判定と根拠は script 側に 1 か所だけ置く。
      - name: Decide whether to run the non-ASCII real-model regression (#377)
        id: nonascii-scope
        if: runner.os == 'Windows'
        shell: pwsh
        run: python .github/scripts/nonascii_regression_scope.py "${{ github.event_name }}"

      - name: Run non-ASCII real-model regression (#377)
        if: runner.os == 'Windows' && steps.nonascii-scope.outputs.run == 'true'
        shell: pwsh
        env:
          LIVECAP_NONASCII_REAL_MODELS: "1"
        run: |
          $out = python -m pytest tests/nonascii -m "nonascii_paths and slow" -v -rs 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 通っただけでは足りない。**対象行が PASSED したこと**を確かめる。
          #
          # SKIPPED を弾くだけでは不十分だった: test が改名・deselect・未収集に
          # なると SKIPPED が出ないまま緑になる。**存在を要求する**方向で書く。
          # (初回 CI はモデル不在で silent skip し、見せかけのゲートになった。)
          $targets = @(
            'test_real_model_boundary[engine.reazonspeech.sherpa_from_transducer] PASSED',
            # #379 の raw track。「NeMo 単体では非 ASCII %TEMP% で失敗する」という
            # **基準データ**が取れ続けていることを要求する。これが skip に落ちると、
            # 対策 (ascii_safe_temp_environment) がまだ必要かどうか分からなくなる。
            'test_heavy_boundary[engine.nemo.untar_temp] PASSED',
            'test_heavy_boundary[engine.nemo.restore_path_only] PASSED',
            # #413: 発話ごとの一時 wav を **consumer (ネイティブ ASR) へ渡す**境界。
            # 4 node とも **cjk_kana と outside_acp の両方**を node の内側で回す
            # (required_variants)。片方でも欠ければ test 側が fail するので、
            # ここでは node の PASSED を要求すれば両 variant の完走まで保証される。
            'test_heavy_boundary[engine.parakeet.utterance_wav] PASSED',
            'test_heavy_boundary[engine.canary.utterance_wav] PASSED',
            'test_real_model_boundary[engine.whispers2t.utterance_wav] PASSED',
            'test_real_model_boundary[engine.voxtral.utterance_wav] PASSED',
            # #413 PR C: qwen3asr は **auto-detect 経路でのみ**この境界に到達する。
            # engines-qwen3asr extra と、warm step が埋めた HF hub cache の両方が
            # 要るので、どちらが欠けても skip になる — だから PASSED を要求する。
            'test_real_model_boundary[engine.qwen3asr.utterance_wav] PASSED',
            # #387: tokenizers (Rust native) が narrow path でないこと。
            # **cjk_kana だけでは足りない** — cp932 の内側なので narrow path でも
            # 通ってしまう。required_variants で outside_acp を必須にしてあるので、
            # node の PASSED を要求すれば両 variant の完走まで保証される。
            'test_real_model_boundary[engine.voxtral.autoprocessor] PASSED',
            # #387 PR B: **ローカル snapshot からの load 境界**。どちらも
            # required_variants を持つので、node の PASSED は両 variant の完走を保証する。
            # skip に落ちるのは source が無いときなので、PASSED を要求して弾く。
            'test_real_model_boundary[engine.whispers2t.load_model] PASSED',
            'test_real_model_boundary[engine.qwen3asr.from_pretrained] PASSED',
            # #422: PyTorch CUDA Jiterator の kernel cache。**モデルは要らないが
            # CUDA が要る** ので、実モデル tier とは別 (gpu tier) にしてある。
            # CPU ランナーでは probe が skip するので、**このゲートを置けるのは
            # ここだけ**である。
            'test_gpu_boundary[framework.pytorch.cuda_jiterator_kernel_cache] PASSED'
          )
          foreach ($target in $targets) {
            if (-not $out.Contains($target)) {
              throw "非 ASCII real-model regression が PASSED していない - skip / 改名 / 未収集のいずれか。ゲートが失効している。期待した行: $target"
            }
          }

      # #422 の**上流側の前提**。「ACP 外で壊れる / cjk_kana では壊れない /
      # CPU は無関係 / cache が populate されない」を固定する。
      #
      # **既定の無効化 (#422) が正しい判断であり続けることを、ここが保証する。**
      # 上流が rename を直せば cache に代償が生まれるので、そのとき落ちて再評価を
      # 促す設計にしてある。CUDA が要るので走れる runner はここだけである。
      # #462 の CUDA メモリ解放も同じ `slow and gpu` なのでこの step で収集される。
      # 実 GPU が要る (cuBLAS workspace は CUDA を初期化しないと現れない)。
      # 引用符が要る: 空白の後の `#` は YAML のコメントになり、名前が `... (#422 kernel cache /` で切れていた
      - name: "Run PyTorch runtime GPU checks (#422 kernel cache / #462 CUDA memory release)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 既定の addopts が `-m 'not network and not slow'` なので marker を明示して
          # 上書きする。CUDA が無ければ module 全体が skip するが、この runner には
          # ある — **skip を緑にしないため PASSED を要求する**。
          $out = python -m pytest tests/integration/runtime -m "slow and gpu" -v -rs 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $targets = @(
            'test_outside_acp_cache_path_breaks_cuda PASSED',
            'test_cjk_kana_cache_path_does_not_reproduce PASSED',
            'test_cpu_path_is_unaffected PASSED',
            'test_cache_is_not_populated_on_windows PASSED',
            # mitigated track — production 経路 (EngineFactory -> load_model ->
            # transcribe) が ACP 外の %TEMP% で成功すること。raw track だけでは
            # 「欠陥は実在するが我々の経路では起きない」を言えない (#379 の構成)。
            'test_transcribe_succeeds_with_non_ascii_temp PASSED',
            # #462: empty_cache() だけでは cuBLAS workspace が残ること (上流の前提) と、
            # release_idle_cuda_memory() が baseline へ戻し、idle な別モデルを壊さないこと
            'test_empty_cache_leaves_the_cublas_workspace_and_the_helper_releases_it PASSED',
            'test_idle_model_and_tensor_survive_the_release PASSED'
          )
          foreach ($target in $targets) {
            if (-not $out.Contains($target)) {
              throw "#422 / #462 の GPU チェックが PASSED していない - skip / 改名 / 未収集のいずれか。期待した行: $target"
            }
          }

      # #409 の cache identity。**このテストが走れる runner はここだけ**である
      # (実 ReazonSpeech モデルが常駐する)。engine_smoke + slow なので上の 2 つの
      # smoke step では収集されず、放っておくと**どこでも走らないテスト**になる。
      - name: Run Voxtral language contract check (#418)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # **2 系統は marker が違うので別々に走らせる。**
          # contract test は `slow`、既定言語 smoke は `engine_smoke + gpu` (slow ではない)。
          # 1 つの呼び出しに `-m slow` を掛けると、node id を明示していても
          # **smoke 側が deselect される**。
          # なお既定の addopts が `-m 'not network and not slow'` なので、
          # どちらも marker を明示して上書きする必要がある。
          # 既定言語 smoke は上の step でも収集されるが、
          # LIVECAP_REQUIRE_ENGINE_SMOKE は repo variable 依存で、未設定だと **skip が
          # 黙って緑になる**。ここで PASSED を明示的に要求する。
          $contract = python -m pytest `
            tests/integration/engines/test_voxtral_language_contract.py `
            -m slow -v -rs 2>&1 | Out-String
          Write-Host $contract
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $smoke = python -m pytest `
            "tests/integration/engines/test_smoke_engines.py::test_engine_smoke_with_real_audio[voxtral_gpu_default_language]" `
            -m "engine_smoke and gpu" -v -rs 2>&1 | Out-String
          Write-Host $smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $out = $contract + $smoke
          $targets = @(
            'test_auto_prompt_has_no_language_token PASSED',
            'test_concrete_language_prompt_has_language_token[en] PASSED',
            'test_concrete_language_prompt_has_language_token[fr] PASSED',
            'test_auto_and_concrete_prompts_differ PASSED',
            'test_bare_none_is_still_rejected_upstream PASSED',
            'test_engine_smoke_with_real_audio[voxtral_gpu_default_language] PASSED'
          )
          foreach ($target in $targets) {
            if (-not $out.Contains($target)) {
              throw "#418 の language contract check が PASSED していない - skip / 改名 / 未収集のいずれか。期待した行: $target"
            }
          }

      - name: Run ReazonSpeech cache identity check (#409)
        if: runner.os == 'Windows' && env.LIVECAP_LINUX_TAKES_SMOKE != 'true'
        shell: pwsh
        run: |
          python .github/scripts/run_required_tests.py reazonspeech-cache-identity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # #379 の mitigated track。上の raw track が「NeMo 単体では壊れる」ことを示すのに対し、
      # こちらは **production の _load_model_from_path() では壊れない**ことを示す。
      # 両方あって初めて「欠陥は実在し、我々の経路では起きない」と言える。
      #
      # engine_smoke + slow なので、上の 2 つの smoke step (gpu / not gpu) では走らない。
      # 実モデルと NeMo が常駐するこの job で明示的に呼ぶ。
      - name: Run NeMo non-ASCII %TEMP% mitigation check (#379)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 既定の addopts が `-m 'not network and not slow'` なので、-m slow で上書きしないと
          # **0 件収集**になる (pytest は exit 5 を返す)。
          $out = python -m pytest tests/integration/engines/test_nemo_nonascii_temp.py -m slow -v -rs 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $targets = @(
            'test_restore_succeeds_with_non_ascii_temp[parakeet] PASSED',
            'test_restore_succeeds_with_non_ascii_temp[canary] PASSED'
          )
          foreach ($target in $targets) {
            if (-not $out.Contains($target)) {
              throw "#379 の mitigation check が PASSED していない - skip / 改名 / 未収集のいずれか。期待した行: $target"
            }
          }

  # Linux の GPU runner (Ubuntu-Desktop、RTX 4070 Ti 12 GB、labels: self-hosted / Linux / X64 / gpu)。
  # self-hosted の GPU runner が Windows 1 台だけだった頃は、PR ごとの GPU job (約 28 分) が順番待ちに
  # なっていた (2026-11-10 に実測)。OS に依らない engine smoke をこちらへ移し、Windows の job と
  # 並べて流す。Voxtral (16 GB 要) と Windows 固有の確認 (非 ASCII / %TEMP% / runtime) は Windows 側。
  #
  # **repo 変数 LIVECAP_ENABLE_LINUX_GPU_SMOKE が '1' のときだけ作る。** runner を止めている間
  # (Ubuntu-Desktop で長い GPU 作業をする間) や外したときは変数を '1' 以外にする — job は作られず、
  # Windows の job が全部を流す (未登録 runner 宛の job が 24 時間 queue に残る問題は 17b359a を参照)。
  # 手順は docs/development/self-hosted-runners.md。
  engine-smoke-gpu-linux:
    if: vars.LIVECAP_ENABLE_GPU_SMOKE == '1' && vars.LIVECAP_ENABLE_LINUX_GPU_SMOKE == '1'
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 60

    env:
      LIVECAP_ENABLE_GPU_SMOKE: ${{ vars.LIVECAP_ENABLE_GPU_SMOKE }}
      LIVECAP_REQUIRE_ENGINE_SMOKE: ${{ vars.LIVECAP_REQUIRE_ENGINE_SMOKE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure persistent paths (Linux)
        shell: bash
        run: |
          cache_root="$HOME/LiveCap/Cache"
          mkdir -p "$cache_root/uv" "$cache_root/models" "$cache_root/cache" "$cache_root/ffmpeg-bin"
          {
            echo "UV_CACHE_DIR=$cache_root/uv"
            echo "LIVECAP_CORE_MODELS_DIR=$cache_root/models"
            echo "LIVECAP_CORE_CACHE_DIR=$cache_root/cache"
            echo "LIVECAP_FFMPEG_BIN=$cache_root/ffmpeg-bin"
          } >> "$GITHUB_ENV"
          echo "Configured persistent paths at $cache_root"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      # setup-uv が UV_CACHE_DIR を一時 dir で上書きするので戻す
      - name: Restore UV_CACHE_DIR (Linux)
        shell: bash
        run: echo "UV_CACHE_DIR=$HOME/LiveCap/Cache/uv" >> "$GITHUB_ENV"

      # Windows の runner は python3.12 を事前に入れてある。Linux は uv 管理の 3.12 を使う
      # (system の python は 3.14)。無ければ入れる
      - name: Use uv-managed Python 3.12 (Linux)
        shell: bash
        run: |
          python="$(uv python find 3.12 2>/dev/null || true)"
          if [ -z "$python" ]; then
            uv python install 3.12
            python="$(uv python find 3.12)"
          fi
          echo "Using python at $python"
          echo "PYTHON_EXE=$python" >> "$GITHUB_ENV"

      - name: Setup LiveCap FFmpeg
        uses: ./.github/actions/setup-livecap-ffmpeg
        with:
          ffmpeg-bin-dir: ${{ env.LIVECAP_FFMPEG_BIN }}
          # 作業 dir の外の永続 dir なので actions/cache は使わない (検証は走る)
          cache: 'false'

      - name: Sync dependencies (Linux)
        uses: ./.github/actions/setup-livecap-cuda-venv
        with:
          extras: translation dev engines-torch engines-nemo engines-qwen3asr

      # Voxtral は温めない (この runner では smoke を回さない)
      - name: Warm engine caches (GPU / self-hosted, Linux)
        shell: bash
        run: python .github/scripts/warm_engine_caches.py reazonspeech reazonspeech-int8 whispers2t parakeet parakeet_ja canary qwen3asr

      - name: Run engine smoke tests (GPU / self-hosted, Linux)
        shell: bash
        run: python -m pytest tests/integration/engines -m "engine_smoke and gpu" -k "not voxtral" -v

      - name: Run ReazonSpeech cache identity check (#409)
        shell: bash
        run: python .github/scripts/run_required_tests.py reazonspeech-cache-identity
