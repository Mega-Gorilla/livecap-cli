name: Integration Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"  # Weekly on Mondays at 03:00 UTC
  pull_request:
    paths:
      - 'livecap_cli/**'
      - 'tests/integration/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/integration-tests.yml'

jobs:
  transcription-pipeline:
    strategy:
      fail-fast: false
      matrix:
        # hosted (ubuntu) + self-hosted Windows (RTX 4090)。
        # self-hosted Linux runner は運用していないため matrix から除外
        # (登録されない runner 宛の job は 24h キュー滞留後に cancel され、
        #  PR check が恒久的に赤くなるため)。docs/development/self-hosted-runners.md 参照
        os: [ubuntu-latest, [self-hosted, windows]]

    runs-on: ${{ matrix.os }}
    # runner が job を pickup した後に test が hang した場合の hard fail
    # (hosted ubuntu-latest は通常 <2 min で完了)。
    # 注: timeout-minutes は pickup 後にのみ計測されるため、runner offline で
    # queue に滞留するケースは防げない (GitHub の 24h キュー上限で cancel)。
    # self-hosted runner 復旧手順は docs/development/self-hosted-runners.md 参照。
    timeout-minutes: 60
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install libc++ for TenVAD on Ubuntu
      - name: Install libc++ (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libc++1

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Configure Persistent Paths (Windows Self-hosted)
        if: contains(toJSON(matrix.os), 'windows') && contains(toJSON(matrix.os), 'self-hosted')
        shell: pwsh
        run: |
          $ffmpeg = "C:\LiveCap\Cache\ffmpeg-bin"
          New-Item -ItemType Directory -Force -Path $ffmpeg | Out-Null
          "LIVECAP_FFMPEG_BIN=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Runs unconditionally: the action owns both the cache and the
      # "already installed?" decision, and verifies whatever it finds (#395).
      - name: Setup LiveCap FFmpeg
        uses: ./.github/actions/setup-livecap-ffmpeg
        with:
          ffmpeg-bin-dir: ${{ env.LIVECAP_FFMPEG_BIN || 'ffmpeg-bin' }}
          # Self-hosted keeps a persistent directory outside the workspace.
          cache: ${{ env.LIVECAP_FFMPEG_BIN != '' && 'false' || 'true' }}

      - name: Sync dependencies
        run: uv sync --extra translation --extra dev --extra engines-torch

      - name: Run integration tests
        env:
          # Python handles forward slashes on all platforms
          # Use persistent path if available, else relative path
          LIVECAP_FFMPEG_BIN: "${{ env.LIVECAP_FFMPEG_BIN || format('{0}/ffmpeg-bin', github.workspace) }}"
          # Enable realtime E2E tests on self-hosted runners only
          LIVECAP_ENABLE_REALTIME_E2E: ${{ contains(toJSON(matrix.os), 'self-hosted') && '1' || '' }}
        run: |
          uv run python -m pytest tests/integration -m "not engine_smoke"

  engine-smoke-cpu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Setup LiveCap FFmpeg
        uses: ./.github/actions/setup-livecap-ffmpeg
        with:
          ffmpeg-bin-dir: 'ffmpeg-bin'

      - name: Sync dependencies
        run: uv sync --extra translation --extra dev --extra engines-torch

      - name: Warm engine caches (CPU)
        env:
          LIVECAP_FFMPEG_BIN: "${{ github.workspace }}/ffmpeg-bin"
        run: |
          uv run python - <<'PY'
          from livecap_cli import EngineFactory

          def warm(engine_type: str, device: str, lang: str, model_size: str = None) -> None:
              engine_options = {}
              if engine_type == "whispers2t":
                  engine_options["language"] = lang
                  engine_options["model_size"] = model_size or "base"
              elif engine_type in ("canary", "voxtral"):
                  engine_options["language"] = lang
              engine = EngineFactory.create_engine(
                  engine_type=engine_type,
                  device=device,
                  **engine_options,
              )
              engine.load_model()
              models_dir = engine.model_manager.get_models_dir(engine.engine_name)
              print(f"[{engine_type}/{device}] cached at: {models_dir}")

          warm("whispers2t", "cpu", "en", "base")
          PY

      - name: Run engine smoke tests (CPU)
        env:
          LIVECAP_FFMPEG_BIN: "${{ github.workspace }}/ffmpeg-bin"
          LIVECAP_REQUIRE_ENGINE_SMOKE: ${{ vars.LIVECAP_REQUIRE_ENGINE_SMOKE }}
        run: |
          uv run python -m pytest tests/integration/engines -m "engine_smoke and not gpu"

  engine-smoke-gpu:
    if: vars.LIVECAP_ENABLE_GPU_SMOKE == '1'
    strategy:
      fail-fast: false
      matrix:
        # self-hosted Linux runner は未運用のため windows のみ
        # (docs/development/self-hosted-runners.md 参照)
        os: [[self-hosted, windows]]

    runs-on: ${{ matrix.os }}
    # GPU engine_smoke (Canary/Parakeet/Voxtral/Whisper の model load +
    # transcribe + token_confidence verify) は cold cache 時に最大 20-30 min。
    # runner が job を pickup した後に hang した場合、60 min で hard fail。
    # 注: timeout-minutes は pickup 後にのみ計測されるため、runner offline で
    # queue に滞留するケースは防げない (GitHub の 24h キュー上限で cancel)。
    # self-hosted runner 復旧手順は docs/development/self-hosted-runners.md 参照。
    timeout-minutes: 60

    env:
      LIVECAP_ENABLE_GPU_SMOKE: ${{ vars.LIVECAP_ENABLE_GPU_SMOKE }}
      LIVECAP_REQUIRE_ENGINE_SMOKE: ${{ vars.LIVECAP_REQUIRE_ENGINE_SMOKE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Persistent Paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cacheRoot = "C:\LiveCap\Cache"
          
          # Ensure directories exist
          New-Item -ItemType Directory -Force -Path "$cacheRoot\uv" | Out-Null
          New-Item -ItemType Directory -Force -Path "$cacheRoot\models" | Out-Null
          New-Item -ItemType Directory -Force -Path "$cacheRoot\cache" | Out-Null
          New-Item -ItemType Directory -Force -Path "$cacheRoot\ffmpeg-bin" | Out-Null
          
          # Set Environment Variables
          "UV_CACHE_DIR=$cacheRoot\uv" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIVECAP_CORE_MODELS_DIR=$cacheRoot\models" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIVECAP_CORE_CACHE_DIR=$cacheRoot\cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIVECAP_FFMPEG_BIN=$cacheRoot\ffmpeg-bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          
          Write-Host "Configured persistent paths at $cacheRoot"

      - name: Use preinstalled Python (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $python = Get-Command python3.12 | Select-Object -ExpandProperty Source
          if (-not $python) { throw "python3.12 not found on runner" }
          Write-Host "Using python at $python"
          "PYTHON_EXE=$python" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      # Restore UV_CACHE_DIR after setup-uv overwrites it with a temp path
      - name: Restore UV_CACHE_DIR (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "UV_CACHE_DIR=C:\LiveCap\Cache\uv" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Restored UV_CACHE_DIR to C:\LiveCap\Cache\uv"

      # No existence gate here. Gating on "ffmpeg.exe is present" skipped the
      # action outright, and verification with it, so a stale binary in the
      # persistent directory was never noticed (#395). The action decides.
      - name: Setup LiveCap FFmpeg
        uses: ./.github/actions/setup-livecap-ffmpeg
        with:
          ffmpeg-bin-dir: ${{ env.LIVECAP_FFMPEG_BIN }}
          # Persistent directory outside the workspace: actions/cache does not
          # apply to it, but the action still verifies what is already there.
          cache: 'false'

      - name: Sync dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Reuse .venv if exists? No, for now keep clean slate but use cache
          # To optimize further, we could remove this Remove-Item line
          Remove-Item -Recurse -Force .venv -ErrorAction SilentlyContinue

          uv python pin "$Env:PYTHON_EXE"

          # Add venv to PATH for subsequent steps (uv sync creates it)
          echo "$PWD/.venv/Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          # **uv.lock を使う。** 以前は `uv pip install -e .[...]` で毎回解決し直しており、
          # ローカル / 他 job (uv sync) と**別のスタック**が入っていた —
          # nemo-toolkit 2.4.1 / torch 2.6.0+cu124 / pytorch-lightning 2.6.5 /
          # transformers 5.16 など。その結果 (a) lightning 2.6 が NeptuneLogger を
          # 削除したため NeMo が import できず **parakeet / parakeet_ja / canary の
          # smoke が全部 skip されたまま緑**になり、(b) 解決し直したスタックでのみ
          # parakeet EN の TDT decode が IndexError で落ちていた (#379 で発覚)。
          #
          uv sync --extra translation --extra dev --extra engines-torch --extra engines-nemo

          # **lock の torch は PyPI の CPU wheel (2.9.1+cpu) なので CUDA build へ差し替える。**
          # バージョンは lock が入れたものをそのまま読む — ここに数値を書くと lock と
          # 二重管理になり、また NeMo 側のスタックが道連れで動くのが元の問題だった。
          #
          # `+cpu` の local version は落とす (cu128 index に `2.9.1+cpu` は無い)。
          # `--reinstall-package` も要る — `torch==2.9.1` は `2.9.1+cpu` で充足されるので、
          # 付けないと uv は「既に満たされている」と判断して**何もしない**。
          $torchVer  = (uv run python -c "import importlib.metadata as m; print(m.version('torch').split('+')[0])").Trim()
          $audioVer  = (uv run python -c "import importlib.metadata as m; print(m.version('torchaudio').split('+')[0])").Trim()
          $visionVer = (uv run python -c "import importlib.metadata as m; print(m.version('torchvision').split('+')[0])").Trim()
          uv pip install `
            --reinstall-package torch --reinstall-package torchaudio --reinstall-package torchvision `
            "torch==$torchVer" "torchaudio==$audioVer" "torchvision==$visionVer" `
            --index-url https://download.pytorch.org/whl/cu128

          # **CUDA が無ければここで落とす。** GPU smoke は CUDA 不在だと全 skip するので、
          # 黙って通すと「緑だが 1 つも engine を通っていない」状態になる (実際に起きた)。
          uv run python -c "import sys, torch; print('torch', torch.__version__, 'cuda_available', torch.cuda.is_available()); sys.exit(0 if torch.cuda.is_available() else 1)"
          if ($LASTEXITCODE -ne 0) { throw "CUDA が使えない - GPU smoke が全 skip になるので install 手順を直すこと" }

      - name: Warm engine caches (GPU / self-hosted, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # LIVECAP_FFMPEG_BIN is already set globally by Configure Persistent Paths
        run: |
          $script = @"
          import os
          import sys

          # Monkey-patch os.uname for Windows to satisfy lhotse dependency
          # Note: Keep this logic in sync with tests/conftest.py
          if sys.platform == "win32" and not hasattr(os, "uname"):
              from collections import namedtuple
              UnameResult = namedtuple("UnameResult", ["sysname", "nodename", "release", "version", "machine"])
              def uname():
                  # Avoid platform.* calls that might recurse back to os.uname
                  return UnameResult(
                      sysname="Windows",
                      nodename=os.environ.get("COMPUTERNAME", "unknown"),
                      release=os.environ.get("OS", "unknown"),
                      version="10.0.xxxx",
                      machine=os.environ.get("PROCESSOR_ARCHITECTURE", "AMD64")
                  )
              os.uname = uname

          from livecap_cli import EngineFactory
          import gc
          import torch

          def warm(engine_type: str, device: str, lang: str, model_size: str = None) -> None:
              try:
                  # Build engine options based on engine type
                  engine_options = {}
                  if engine_type == 'whispers2t':
                      engine_options['language'] = lang
                      engine_options['model_size'] = model_size or 'base'
                  elif engine_type in ('canary', 'voxtral'):
                      engine_options['language'] = lang
                  engine = EngineFactory.create_engine(
                      engine_type=engine_type,
                      device=device,
                      **engine_options,
                  )
                  engine.load_model()
                  models_dir = engine.model_manager.get_models_dir(engine.engine_name)
                  print(f'[{engine_type}/{device}] cached at: {models_dir}')
                  # Cleanup to free VRAM for next engine
                  if hasattr(engine, 'cleanup'):
                      engine.cleanup()
                  del engine
              except Exception as e:
                  print(f'[{engine_type}/{device}] SKIP (warm-up failed): {e}')
              finally:
                  gc.collect()
                  if torch.cuda.is_available():
                      torch.cuda.empty_cache()

          warm('reazonspeech', 'cuda', 'ja')
          warm('whispers2t', 'cuda', 'en', 'base')
          warm('parakeet', 'cuda', 'en')
          warm('parakeet_ja', 'cuda', 'ja')
          warm('canary', 'cuda', 'en')
          warm('voxtral', 'cuda', 'en')
          "@

          $script | Out-File warmup.py -Encoding utf8
          # Use python directly
          python warmup.py

      - name: Run engine smoke tests (GPU / self-hosted, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # LIVECAP_FFMPEG_BIN set globally
          LIVECAP_ENABLE_GPU_SMOKE: ${{ vars.LIVECAP_ENABLE_GPU_SMOKE }}
          LIVECAP_REQUIRE_ENGINE_SMOKE: ${{ vars.LIVECAP_REQUIRE_ENGINE_SMOKE }}
        run: |
          # Use python directly
          python -m pytest tests/integration/engines -m "engine_smoke and gpu" -v

      # 非 ASCII パスの real-model regression (#377)。
      #
      # 通常 CI (`pytest tests`) では cheap tier しか走らない — real_model tier は
      # LIVECAP_NONASCII_REAL_MODELS=1 と `slow` マーカーの両方を要求するため
      # (tests/nonascii/test_probes.py の test_real_model_boundary)。判定を
      # observation から regression へ変えるだけでは**将来の依存更新を防ぐ
      # ゲートにならない**ので、実モデルが常駐するこの job に置く。
      #
      # このランナーは LIVECAP_CORE_MODELS_DIR を永続させ、上の warmup で
      # reazonspeech を温めている。
      - name: Run non-ASCII real-model regression (#377)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LIVECAP_NONASCII_REAL_MODELS: "1"
        run: |
          $out = python -m pytest tests/nonascii -m "nonascii_paths and slow" -v -rs 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 通っただけでは足りない。**対象行が PASSED したこと**を確かめる。
          #
          # SKIPPED を弾くだけでは不十分だった: test が改名・deselect・未収集に
          # なると SKIPPED が出ないまま緑になる。**存在を要求する**方向で書く。
          # (初回 CI はモデル不在で silent skip し、見せかけのゲートになった。)
          $targets = @(
            'test_real_model_boundary[engine.reazonspeech.sherpa_from_transducer] PASSED',
            # #379 の raw track。「NeMo 単体では非 ASCII %TEMP% で失敗する」という
            # **基準データ**が取れ続けていることを要求する。これが skip に落ちると、
            # 対策 (ascii_safe_temp_environment) がまだ必要かどうか分からなくなる。
            'test_heavy_boundary[engine.nemo.untar_temp] PASSED',
            'test_heavy_boundary[engine.nemo.restore_path_only] PASSED'
          )
          foreach ($target in $targets) {
            if (-not $out.Contains($target)) {
              throw "非 ASCII real-model regression が PASSED していない - skip / 改名 / 未収集のいずれか。ゲートが失効している。期待した行: $target"
            }
          }

      # #379 の mitigated track。上の raw track が「NeMo 単体では壊れる」ことを示すのに対し、
      # こちらは **production の _load_model_from_path() では壊れない**ことを示す。
      # 両方あって初めて「欠陥は実在し、我々の経路では起きない」と言える。
      #
      # engine_smoke + slow なので、上の 2 つの smoke step (gpu / not gpu) では走らない。
      # 実モデルと NeMo が常駐するこの job で明示的に呼ぶ。
      - name: Run NeMo non-ASCII %TEMP% mitigation check (#379)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 既定の addopts が `-m 'not network and not slow'` なので、-m slow で上書きしないと
          # **0 件収集**になる (pytest は exit 5 を返す)。
          $out = python -m pytest tests/integration/engines/test_nemo_nonascii_temp.py -m slow -v -rs 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $targets = @(
            'test_restore_succeeds_with_non_ascii_temp[parakeet] PASSED',
            'test_restore_succeeds_with_non_ascii_temp[canary] PASSED'
          )
          foreach ($target in $targets) {
            if (-not $out.Contains($target)) {
              throw "#379 の mitigation check が PASSED していない - skip / 改名 / 未収集のいずれか。期待した行: $target"
            }
          }
