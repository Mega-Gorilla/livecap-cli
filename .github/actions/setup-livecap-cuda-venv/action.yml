name: 'Setup LiveCap CUDA venv (self-hosted Windows)'
description: >-
  Creates a clean .venv from uv.lock with the given extras, swaps the lock's
  CPU torch wheels for the CUDA build of the same versions, and fails unless
  CUDA is usable. Adds .venv/Scripts to PATH for later steps.

# Why this exists (#379 / #470):
#
#  * **Install from uv.lock, never re-resolve.** Workflows that ran
#    `uv pip install -e .[...]` got a different stack on every run. In #379 that
#    meant nemo-toolkit / pytorch-lightning drift that silently skipped every
#    NeMo smoke; in #470 the re-resolved nemo-toolkit 2.4.1 stopped pulling in
#    optuna, so VAD optimization could not even start. uv.lock is the source of
#    truth (CLAUDE.md), so every GPU workflow installs from it.
#  * **The lock's torch is the PyPI CPU wheel.** Swap it for the CUDA build of
#    the *same* version, read back from what the lock installed - writing the
#    numbers here would duplicate the lock.
#  * **No `uv run` afterwards.** `uv run` re-syncs the env to the lock and puts
#    the CPU wheels back (observed: `Uninstalled 2 packages` right after the
#    swap). Later steps use the plain `python` on PATH.
#  * **Fail fast without CUDA.** GPU smoke skips everything without CUDA and an
#    optimization would crawl on CPU, so a CPU-only env is an error here.
#
# Requires `PYTHON_EXE` (the preinstalled interpreter) and uv on PATH.

inputs:
  extras:
    description: 'Space-separated optional-dependency groups to install (e.g. "engines-torch dev")'
    required: true
  torch-index-url:
    description: 'PyTorch wheel index providing the CUDA build'
    default: 'https://download.pytorch.org/whl/cu128'
    required: false

runs:
  using: "composite"
  steps:
    - name: Sync locked dependencies and install CUDA torch
      shell: pwsh
      env:
        LIVECAP_EXTRAS: ${{ inputs.extras }}
        LIVECAP_TORCH_INDEX: ${{ inputs.torch-index-url }}
      run: |
        $extras = @($Env:LIVECAP_EXTRAS -split '\s+' | Where-Object { $_ })
        if ($extras.Count -eq 0) { throw "extras is empty" }
        foreach ($e in $extras) {
          if ($e -notmatch '^[a-z0-9][a-z0-9-]*$') { throw "invalid extra name: $e" }
        }

        # Clean slate: a non-ephemeral runner keeps the workspace between jobs.
        Remove-Item -Recurse -Force .venv -ErrorAction SilentlyContinue
        uv python pin "$Env:PYTHON_EXE"
        if ($LASTEXITCODE -ne 0) { throw "uv python pin failed" }

        $syncArgs = @('sync', '--locked')
        foreach ($e in $extras) { $syncArgs += @('--extra', $e) }
        Write-Host "uv $($syncArgs -join ' ')"
        uv @syncArgs
        if ($LASTEXITCODE -ne 0) { throw "uv sync failed" }

        echo "$PWD/.venv/Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

        # Swap the installed torch family for the CUDA build of the same versions.
        # `--reinstall-package` is required: `torch==2.9.1` is already satisfied by
        # `2.9.1+cpu`, so without it uv does nothing. Reading the versions lives in
        # torch_pins.py (tested in tests/ci): it drops the `+cpu` local version and
        # skips family members the extras did not install.
        $py = ".venv\Scripts\python.exe"
        $pins = @(& $py (Join-Path $Env:GITHUB_ACTION_PATH 'torch_pins.py') | Where-Object { $_ })
        if ($LASTEXITCODE -ne 0 -or $pins.Count -eq 0) { throw "could not read the installed torch versions (exit $LASTEXITCODE)" }
        $reinstall = @()
        foreach ($pin in $pins) { $reinstall += @('--reinstall-package', ($pin -split '==')[0]) }
        Write-Host "Installing CUDA build: $($pins -join ' ') from $Env:LIVECAP_TORCH_INDEX"
        uv pip install @reinstall @pins --index-url "$Env:LIVECAP_TORCH_INDEX"
        if ($LASTEXITCODE -ne 0) { throw "CUDA torch install failed" }

        & $py -c "import sys, torch; print('torch', torch.__version__, 'cuda', torch.version.cuda, 'cuda_available', torch.cuda.is_available()); print('device', torch.cuda.get_device_name(0) if torch.cuda.is_available() else '-'); sys.exit(0 if torch.cuda.is_available() else 1)"
        if ($LASTEXITCODE -ne 0) { throw "CUDA is not available after the swap - fix the install steps (GPU work would skip or fall back to CPU)" }
