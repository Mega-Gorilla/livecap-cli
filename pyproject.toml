[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "livecap-cli"
version = "0.3.0"
description = "High-performance speech transcription CLI with multi-engine support."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "AGPL-3.0-only"
maintainers = [
  { name = "PineLab" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech"
]
authors = [
  { name = "Pine Lab" }
]
dependencies = [
  "appdirs>=1.4.4",
  "ffmpeg-python",
  # transformers 5 (5.18 以降) が `>=1.31` を要求する。上限 `<2.0` は NeMo の都合なので
  # engines-nemo / all に書く (#471)
  "huggingface-hub>=1.31.0",
  "filelock>=3.12",
  "langcodes>=3.4.0",  # BCP-47 language code parsing for ASR engines
  "librosa",
  "moviepy",
  "numba>=0.57.0",  # Python 3.11 support (0.55 / 0.56 are <3.11 only)
  "numpy",
  "onnxruntime",
  "pydub",
  "requests>=2.31",
  "scipy",
  "sounddevice",
  "soundfile",
  # sherpa-onnx + sherpa-onnx-core must stay at the SAME version: the
  # sherpa-onnx wheel declares `Requires-Dist: sherpa-onnx-core==<ver>`.
  # Pinning both to the same exact version avoids the 1.12.39 / 1.13.2
  # split that #298 left behind (codex-review on #298). Bump together.
  #
  # 1.13.6 (#377): 1.12.39 は tokens.txt を narrow path の std::ifstream で読み、
  # Windows の非 ASCII パスで SymbolTable が空のまま黙って構築されていた
  # (ロードは成功し decode が全件 IndexError)。上流 PR #3255 で SymbolTable が
  # OpenInputFile() -> ToWideString() を通るようになり解消した。
  "sherpa-onnx==1.13.6",
  "sherpa-onnx-core==1.13.6",
  "tokenizers>=0.14.0",  # Python 3.11+ wheels required; pip resolver fix for whisper-s2t
  "optimum>=1.17.0",  # Proper metadata/wheels; pip resolver fix for whisper-s2t transitive dep
  # transformers 5 系 (#471)。下限は全 engine / 翻訳を実モデルで確かめた 5.22 系 (5.21.0 以降は
  # Python 3.11+)。Qwen3-ASR は transformers 本体の `Qwen3ASRForConditionalGeneration` を使う。
  # extra の下限も同じ値にする (tests/core/test_packaging_constraints.py が固定する)
  "transformers>=5.22.0",  # pip resolver fix for whisper-s2t
  # transformers 5 は torch 2.6 未満だと PyTorch の backend を無効にする (`is_torch_available()` が
  # False になり、Qwen3-ASR / Voxtral / Riva などを読めない、#471)。torch は whisper-s2t が版の
  # 指定なしで要求するので既に入る — ここでは下限だけを足す。torch を書く extra も同じ下限にする
  "torch>=2.6",
  "ctranslate2>=3.24.0",  # Python 3.11+ wheels; pip resolver fix for whisper-s2t transitive dep
  "tqdm>=4.65",
  "whisper-s2t",
  # VAD backends (required for realtime transcription)
  # NOTE: TenVAD requires libc++ on Linux: sudo apt-get install libc++1
  "silero-vad>=5.1",
  "webrtcvad-wheels>=2.0.10",  # Pre-built wheels for Windows/macOS/Linux (no C compiler required)
  "ten-vad @ git+https://github.com/TEN-framework/ten-vad.git@a64b408d9ff89cd92bd0772ed99f9d58b7a005b1",
]
keywords = ["speech-to-text", "translation", "live captioning"]

license-files = ["LICENSE", "LICENSE-COMMERCIAL.md"]

[project.urls]
Homepage = "https://github.com/Mega-Gorilla/livecap-cli"
Source = "https://github.com/Mega-Gorilla/livecap-cli"
Issues = "https://github.com/Mega-Gorilla/livecap-cli/issues"
Documentation = "https://github.com/Mega-Gorilla/Live_Cap_v3/tree/main/docs"
Discord = "https://discord.gg/hdSV4hJR8Y"
Steam = "https://store.steampowered.com/app/3327370/"

[project.scripts]
livecap-cli = "livecap_cli.cli:main"

[project.optional-dependencies]
"engines-nemo" = [
  # Core NeMo
  "Cython",
  "hydra-core",
  "matplotlib",  # Required by NeMo for visualization/logging
  # NeMo 2.3.1〜2.4.x は `transformers<=4.52.0` に固定しているので、transformers 5 では 2.3.0
  # が選ばれる (2.3.0 は transformers の上限を持たず、5.22 で import / 推論を確認済み、#471)。
  # 2.5+ は #379 の時点では nvidia-one-logger が公開 PyPI に無かったため外した (未検証)
  "nemo-toolkit>=2.3.0,<2.5.0",  # 2.1.0 has canary transcription bug (empty output)
  "ml-dtypes>=0.5.0; python_version < '3.13'",
  # Runtime deps that nemo_toolkit[asr] pulls but excluding texterrors
  # (texterrors is sdist-only and needs Visual Studio C++ Build Tools on Windows;
  #  it is only used for WER computation, not inference). Listing explicitly
  # keeps Windows installs painless while preserving parity with the [asr] extra.
  "lhotse",
  "pyannote.core",
  "pyannote.metrics",
  "datasets",
  "ipython",  # Imported by nemo.collections.asr.parts.utils.vad_utils
  # **上限が要る。** huggingface-hub 2.x を選ぶと datasets が 5.x (`hub>=1.31` / `pyarrow>=24`) に
  # 上がり、pyarrow 24+ は NumPy 2 を前提にするので、NeMo 2.3.0 の `numpy<2` と衝突して
  # `import nemo.collections.asr` が `pyarrow requires NumPy 2.0 or newer` で落ちる (#471 で実測)。
  # hub 1.x なら datasets 4.4 / pyarrow 22 のまま
  "huggingface-hub<2.0",
  "einops",
  "cloudpickle",
  "fiddle",
  # **上限が要る。** lightning 2.6.0 が `NeptuneLogger` を削除した一方、NeMo 2.3.0 は
  # `nemo/utils/loggers/__init__.py` で無条件に import するため、2.6 以上を入れると
  # `import nemo.collections.asr` が ImportError で落ちる。lock は 2.4.0 で通っていたが、
  # lock を見ない `uv pip install -e .[engines-nemo]` (self-hosted runner の CI) では
  # 2.6.5 が入り、**NeMo 系 3 engine の smoke が全部 skip されたまま緑**になっていた (#379)。
  "lightning>=2.0.0,<2.6",
  "editdistance",
  "jiwer",  # Word error rate (pure python; replaces texterrors for NeMo's wfst_decoder import)
  "braceexpand",
  "webdataset",
  "marshmallow",
  "tabulate",
  "sentencepiece",
  "soxr",
  "resampy",
  # Voxtral / Canary shared deps
  "transformers>=5.22.0",  # Required for Voxtral (VoxtralForConditionalGeneration)
  # transformers 5.22 の `apply_transcription_request` は mistral-common 1.11.5 以上を要求する
  # (それ未満だと、入っていても `requires the mistral-common library` で落ちる、#471)
  "mistral-common[audio]>=1.11.5",  # Required for Voxtral audio processing
]
"engines-torch" = [
  "reazonspeech-k2-asr @ git+https://github.com/reazon-research/ReazonSpeech.git@9d80a30af1b5f456817db901a28ae462731b8157#subdirectory=pkg/k2-asr",
  "torch>=2.6",
  "torchaudio",
  "torchvision",
]
"engines-voxtral" = [
  "torch>=2.6",  # Required for Voxtral inference (transformers 5 の最低版)
  "transformers>=5.22.0",  # Required for Voxtral (VoxtralForConditionalGeneration)
  "mistral-common[audio]>=1.11.5",  # Required by transformers 5.22 apply_transcription_request
]
"engines-qwen3asr" = [
  # transformers 本体の Qwen3-ASR (`Qwen3ASRForConditionalGeneration` + `-hf` repo) を使う。
  # qwen-asr package は `transformers==4.57.6` に固定しているので使わない (#471)
  "transformers>=5.22.0",
  "accelerate>=1.1.0",  # device_map="auto" (transformers 5 の最低版)
  "torch>=2.6",  # Required for model inference (transformers 5 の最低版)
]
"translation" = [
  # Google translation needs nothing beyond the core `requests` dependency and
  # the standard library: the adapter talks to the endpoint directly (#402).
  # The extra is kept (empty) because five CI workflow steps and the install
  # docs use `--extra translation`; removing the name would break them.
]
"translation-local" = [
  "ctranslate2>=4.0.0",        # OPUS-MT inference engine
  "transformers>=5.22.0",      # Model loading & tokenizer
  # sentencepiece is auto-installed by transformers
]
"translation-riva" = [
  # `AutoTokenizer(fix_mistral_regex=True)` と `from_pretrained(dtype=)` を使う (#461)。5.22 で
  # 実モデルを確かめ、#461 の 3 警告は 0 件 (#471)
  "transformers>=5.22.0",      # Riva-4B model loading & chat template
  "torch>=2.6",                # GPU inference (transformers 5 の最低版)
  "accelerate>=1.1.0",         # device_map="auto" (transformers 5 の最低版)
]
"dev" = [
  "pytest>=8.4",
  "yt-dlp>=2024.0.0",  # benchmarks/confidence_calibration/build_corpus.py audio source download (Issue #338 PR-β)
  "pykakasi>=2.3.0",   # benchmarks/confidence_calibration/_normalize_jp.py kana normalization for calibration alignment (Issue #338 PR-γ, GPL-3.0-or-later, dev-only)
  "jiwer>=3.0",        # benchmarks/common/metrics.py の CER / WER。採点の正規化の test が実際の採点を通す (#488、Apache-2.0)
  "kanjize>=1.6.1",    # benchmarks/confidence_calibration/_normalize_jp.py compound kanji numeral parsing for calibration alignment (Issue #338 PR-γ codex-review 1st round fix, MIT, dev-only)
]
"benchmark" = [
  # JaVAD for Japanese VAD benchmarking (other VAD backends are in default dependencies)
  "javad",
  # Metrics and reporting
  "jiwer>=3.0",      # WER/CER calculation
  "tabulate>=0.9",   # Console table formatting
]
"optimization" = [
  # Bayesian optimization framework
  "optuna>=3.0",
  # Visualization (HTML reports with interactive charts)
  "plotly>=5.0",
  # Includes benchmark dependencies
  "jiwer>=3.0",
  # JaVAD for optimization comparison
  "javad",
]
# Meta extras for easy installation
"recommended" = [
  # Google translation requires no extra dependency (#402). Kept for the
  # documented install path.
]
"all" = [
  # All engines
  "Cython",
  "hydra-core",
  "matplotlib",
  # **上限は engines-nemo と揃える。** extra は継承しないので、ここに書かないと
  # `pip install livecap-cli[all]` が NeMo 2.5+ / lightning 2.6+ を選べてしまい、
  # #379 で直した NeptuneLogger の import failure を再発できる。repo の uv.lock は
  # 全 extra をまとめて解決するため、この漏れを隠す。
  # tests/core/test_packaging_constraints.py が両者のずれを検出する。
  "nemo-toolkit>=2.3.0,<2.5.0",
  "nemo_toolkit[asr]>=2.3.0,<2.5.0",
  "lightning>=2.0.0,<2.6",
  "huggingface-hub<2.0",
  "ml-dtypes>=0.5.0; python_version < '3.13'",
  # **下限も narrow extra と揃える。** `all` は torch / accelerate / transformers を含み、各 extra の
  # 機能をまとめて使える構成なので、ここが緩いと `pip install livecap-cli[all]` が narrow extra の
  # 下限より古い版を選べてしまう (#461)。tests/core/test_packaging_constraints.py が下限の drift も検出する
  "transformers>=5.22.0",
  "mistral-common[audio]>=1.11.5",
  "reazonspeech-k2-asr @ git+https://github.com/reazon-research/ReazonSpeech.git@9d80a30af1b5f456817db901a28ae462731b8157#subdirectory=pkg/k2-asr",
  "torch>=2.6",
  "torchaudio",
  "torchvision",
  # All translation (Google needs no extra dependency - #402)
  "ctranslate2>=4.0.0",
  "accelerate>=1.1.0",
  # Benchmark and optimization
  "javad",
  "jiwer>=3.0",
  "tabulate>=0.9",
  "optuna>=3.0",
  "plotly>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["livecap_cli*", "benchmarks*"]

[tool.setuptools.package-data]
"livecap_cli.vad.presets" = ["*.json"]
# ffmpeg_manifest.json is read at runtime by ffmpeg_pins (Issue #398).
"livecap_cli.resources" = ["*.json"]
# Whisper の英米の綴りの対応表と、その MIT ライセンス (benchmarks/common/text_normalization.py、#488)
"benchmarks.common" = ["data/whisper_english_spelling.json", "data/LICENSE.whisper"]

[tool.pytest.ini_options]
markers = [
  "engine_smoke: end-to-end engine smoke tests with real audio fixtures",
  "gpu: tests that require a CUDA-capable environment",
  "realtime_e2e: E2E tests for realtime transcription (requires LIVECAP_ENABLE_REALTIME_E2E=1)",
  "network: tests that require network access (opt-in via -m network)",
  "slow: slow tests that download/load models (opt-in via -m slow)",
  "evaluation_harness: PR-0 baseline + Phase 1 regression metrics for the non-speech filter stack (Issue #295)",
  "sed_evaluation: Phase 2 SED model evaluation harness — off-line accuracy/safety/runtime/license measurement (Issue #305 PR-D0)",
  "nonascii_paths: non-ASCII path boundary probes (Issue #378 / epic #380). cheap tier runs by default; real-model tier additionally needs 'slow' + LIVECAP_NONASCII_REAL_MODELS=1",
]
# Default: skip network and slow tests (opt-in via: pytest -m 'network or slow')
addopts = "-m 'not network and not slow'"


